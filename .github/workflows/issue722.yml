name: testing-722

on:
  workflow_dispatch:
 

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create sample Go project
        run: |
          rm -f go.mod go.sum
          cat > go.mod <<'EOF'
          module example.com/repro

          go 1.25.0
          EOF

          cat > main.go <<'EOF'
          package main

          import (
            "fmt"

            "github.com/gin-gonic/gin"
            _ "k8s.io/client-go/kubernetes"
          )

          func main() {
            r := gin.Default()
            fmt.Println(r)
          }
          EOF

      - name: Bootstrap deps (no cache)
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Resolve dependencies
        run: |
          go get github.com/gin-gonic/gin@v1.10.0
          go get k8s.io/client-go@v0.32.0
          go mod tidy
          go mod download all
          echo "=== MUST be hundreds of MB ==="
          du -sh ~/go/pkg/mod ~/.cache/go-build
          ls ~/go/pkg/mod/github.com | head

      - name: setup-go (1st call)
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: setup-go (2nd call - expect tar "File exists")
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
