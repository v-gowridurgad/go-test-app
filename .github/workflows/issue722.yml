name: issue722

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
        

      # Any second call to setup-go with cache enabled triggers the issue
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
