name: testing-63

on:
  workflow_dispatch:

jobs:
  boundary:
    name: ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - 'go1.8.5rc1'    # makeSemver docs: 1.8.5rc1 => 1.8.5-rc.1
          - 'go1.21.5beta1' # patch + beta
          - 'go1.21.0rc1'   # explicit .0 + rc
          - 'go1'           # bare major — real upstream tag
          - 'go1.9'         # old minor, no patch
          - 'go1.10beta1'   # two-digit minor + beta
    steps:
      - uses: actions/checkout@v7

      - uses: v-jitenderpalsingh/setup-go@test-go-version-ne
        with:
          go-version: '${{ matrix.go }}'
        

