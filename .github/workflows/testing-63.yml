name: testing-63

on:
  workflow_dispatch:

jobs:
  native-valid:
    name: ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['go1.21', 'go1.21.5', 'go1.18beta2', 'go1.21rc2', 'go1.24.0']
    steps:
      - uses: actions/checkout@v7

      - uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version: '${{ matrix.go }}'
         

   
