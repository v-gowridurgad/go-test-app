name: testing-63

on:
  workflow_dispatch:

jobs:
  reject:
    name: reject ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - 'go1.21.x'     # wildcard with go prefix
          - 'go^1.21'      # caret range with go prefix
          - 'go~1.21'      # tilde range with go prefix
          - 'go>=1.21'     # comparator with go prefix
          - 'go1.21.'      # trailing dot
          - 'go1.21beta'   # prerelease with no number
          - 'go1.21beta0'  # zero-indexed prerelease
          - 'go01.21'      # leading zero
          - 'go1.21.5.1'   # four components
          - 'gofoo'        # garbage
          - 'go'           # prefix only
    steps:
      - uses: actions/checkout@v7

      - uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version: '${{ matrix.go }}'
       

    
