name: testing-63

on:
  workflow_dispatch:

jobs:
  native-pins-zero:
    name: go1.21 (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version: 'go1.21'
  

  semver-floats:
    name: 1.21 (semver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version: '1.21'   

  native-with-check-latest:
    name: go1.21 + check-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version: 'go1.21'
          check-latest: true
         
