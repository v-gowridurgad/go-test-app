name: testing-63

on:
  workflow_dispatch:

jobs:
  semver:
    name: ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - '1.25'              # minor only
          - '1.24.11'           # exact
          - '1.24.0-rc.1'       # semver prerelease
          - '1.23.0-beta.1'
          - '^1.24.0'           # caret range
          - '~1.24.1'           # tilde range
          - '>=1.22.0 <1.24.0'  # compound range
          - '1.25.x'            # wildcard
          - '1.x'
          - 'stable'            # alias
          - 'oldstable'
    steps:
      - uses: actions/checkout@v7

      - uses: v-jitenderpalsingh/setup-go@test-go-version-new
     
        with:
          go-version: '${{ matrix.go }}'
      

      
